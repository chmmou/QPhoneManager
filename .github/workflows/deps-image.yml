name: Dependency image

# The image the release run builds in. It carries the compiler, CMake, Qt with
# the modules the project links, the system libraries the AppImage takes along,
# gpg, and linuxdeploy, appimagetool and the AppImage runtime at the versions
# packaging/appimage/build-appimage.sh pins. That script is copied into the
# image to fetch them, which is why a change to it rebuilds the image.
#
# This is the only workflow with write access to the registry. The release run
# keeps read access and nothing more.
#
# The package is public where the repository is not. Visibility is a setting of
# the package, separate from the one of the repository, and it is changed once
# by hand after the first push. A private package counts against the package
# storage of the account, and this image is larger than that allowance; a public
# one counts against nothing. What it carries is Qt, the build tools and the
# AppImage tools, and no source of this project.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'res/ci/**'
      - 'packaging/appimage/build-appimage.sh'
      - '.github/workflows/deps-image.yml'

permissions:
  contents: read

env:
  # Written out rather than taken from github.repository: the registry accepts
  # no upper case letters, and the repository name has some.
  IMAGE: ghcr.io/chmmou/qphonemanager/ci-ubuntu
  # The minimum the project declares, and the default of the Dockerfile.
  QT_VERSION: 6.9.3

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # The one right this workflow has that the release run does not.
      packages: write

    steps:
      - name: Check out the code
        uses: actions/checkout@v7.0.1

      - name: Set up buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to the registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: res/ci/ubuntu
          file: res/ci/ubuntu/Dockerfile
          # Only the AppImage directory, not the whole checkout, so that no
          # source of the project can reach the public image.
          build-contexts: |
            appimage=packaging/appimage
          push: true
          # The tag names the Qt version. No 'latest': it would move the release
          # run to another image without a change being visible here.
          tags: ${{ env.IMAGE }}:qt${{ env.QT_VERSION }}
          build-args: |
            QT_VERSION=${{ env.QT_VERSION }}
          # Links the package to this repository. While the package is private,
          # only a linked repository's token may read it.
          labels: |
            org.opencontainers.image.source=https://github.com/chmmou/QPhoneManager
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Say what the image promises
        run: |
          set -euo pipefail
          image="$IMAGE:qt$QT_VERSION"

          # Checked here rather than left for the first release run, where a
          # missing piece shows up as a failed build that says nothing about
          # the image.
          docker run --rm --env QT_VERSION "$image" bash -c '
            set -euo pipefail
            test "$(qmake6 -query QT_VERSION)" = "$QT_VERSION"
            test "$(qtpaths6 --query QT_VERSION)" = "$QT_VERSION"
            test -x "$(qmake6 -query QT_INSTALL_LIBEXECS)/qhelpgenerator"
            test -f "$(qmake6 -query QT_INSTALL_LIBS)/libQt6Bluetooth.so.$QT_VERSION"
            test -f "$(qmake6 -query QT_INSTALL_LIBS)/libQt6Help.so.$QT_VERSION"
            test -f "$(qmake6 -query QT_INSTALL_LIBS)/libQt6Svg.so.$QT_VERSION"
            cmake --version
            g++ --version
            gpg --version
            command -v gpg-agent ninja readelf
          '

          # Without a network the script cannot download, so this passes only
          # when the image already holds the three tools with the checksums the
          # script in this commit names.
          docker run --rm --network none \
            --volume "$PWD/packaging/appimage:/check:ro" \
            "$image" /check/build-appimage.sh --fetch-tools

          echo "the image carries what the release run expects"
